<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danger Danger Timer</title>
<meta name="description" content="Blind 60-second timer for the card game Danger Danger — no visible countdown, loud alarm when the minute is up.">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DD Timer">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one full-screen stage, three states (idle / armed / alarm) swapped in place.
     Single committed hazard look — intentionally one theme, all colors explicit. */
  :root{
    --bg:#0a0a0b;            /* near-black field */
    --panel:#141416;         /* raised panel */
    --fg:#f5f3ee;            /* bone white */
    --muted:#8a8780;         /* dim label */
    --hazard:#ffd400;        /* warning yellow */
    --danger:#ff2a1a;        /* alarm red */
    --danger-deep:#b3140a;   /* red shadow */
    --ok:#3a3a3d;            /* idle stripe grey */
    color-scheme:dark;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:"Oswald",system-ui,sans-serif;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }

  .stage{
    height:100%;width:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(1.5rem,5vh,3rem);
    padding:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
    padding-block:clamp(24px,6vh,48px);
    text-align:center;position:relative;z-index:1;
    transition:background .12s;
  }

  /* hazard tape header */
  .tape{
    position:absolute;top:0;left:0;right:0;height:14px;
    background:repeating-linear-gradient(-45deg,var(--hazard) 0 18px,#111 18px 36px);
    opacity:.9;
  }
  .tape.bottom{top:auto;bottom:0}

  .brand{display:flex;flex-direction:column;gap:.25rem;align-items:center}
  .title{
    font-family:"Anton",Impact,sans-serif;font-weight:400;
    font-size:clamp(2.6rem,13vw,5rem);line-height:.9;letter-spacing:.01em;
    text-transform:uppercase;margin:0;
    text-wrap:balance;
    text-shadow:0 0 1px rgba(0,0,0,.6);
  }
  .title .d1{color:var(--hazard)}
  .title .d2{color:var(--danger)}
  .subtitle{
    font-size:clamp(.8rem,3.4vw,1rem);letter-spacing:.32em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin:0;
  }

  /* big circular action button */
  .dial{
    position:relative;width:min(62vw,240px);aspect-ratio:1;max-width:100%;
    border-radius:50%;border:none;cursor:pointer;background:transparent;
    display:grid;place-items:center;
    font-family:"Anton",Impact,sans-serif;text-transform:uppercase;
    color:var(--bg);
    font-size:clamp(1.6rem,7vw,2.4rem);letter-spacing:.04em;
    box-shadow:0 0 0 6px #000, 0 0 0 10px var(--ok), 0 16px 40px rgba(0,0,0,.6);
    transition:transform .08s ease, box-shadow .2s;
  }
  .dial::before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(0,0,0,.35)}
  .dial:active{transform:scale(.96)}
  .dial.start{background:radial-gradient(circle at 50% 35%,#5bff6b,#17c43a 70%);box-shadow:0 0 0 6px #000,0 0 0 10px #0d7a24,0 16px 40px rgba(0,0,0,.6)}
  .dial.stop{background:radial-gradient(circle at 50% 35%,#ffb199,var(--danger) 70%);box-shadow:0 0 0 6px #000,0 0 0 10px var(--danger-deep),0 16px 40px rgba(0,0,0,.6)}

  .hint{font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;min-height:1.2em}

  /* armed indicator: a live pulse, NO numbers */
  .armed{display:flex;flex-direction:column;align-items:center;gap:1.1rem}
  .pulse{
    width:clamp(84px,26vw,120px);aspect-ratio:1;border-radius:50%;
    background:var(--hazard);position:relative;
    box-shadow:0 0 0 0 rgba(255,212,0,0);
  }
  .pulse span{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(2rem,9vw,3rem)}
  /* Each pulse is fired by JS with a random gap/size so it can't be used to count time */
  .pulse.ping{animation:pulse var(--pdur,1.4s) ease-out}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,212,0,.55)}
    100%{box-shadow:0 0 0 var(--psize,42px) rgba(255,212,0,0)}
  }
  .armed-label{font-family:"Anton",sans-serif;font-size:clamp(1.4rem,6vw,2rem);text-transform:uppercase;letter-spacing:.06em;color:var(--hazard)}
  .armed-sub{font-size:.9rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .armed-note{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);opacity:.85;max-width:280px}

  /* ALARM state — fast urgent flash, kept just under 3 flashes/sec (photosensitivity-safe) */
  .stage.alarm{animation:flash .34s steps(1,end) infinite}
  @keyframes flash{0%,49%{background:var(--danger)}50%,100%{background:#120000}}
  .boom{font-family:"Anton",sans-serif;font-size:clamp(3.4rem,18vw,8rem);line-height:.86;text-transform:uppercase;color:#fff;text-shadow:0 0 24px rgba(0,0,0,.5);margin:0;animation:shake .35s ease-in-out infinite}
  @keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-6px) rotate(-1deg)}75%{transform:translateX(6px) rotate(1deg)}}
  .boom-sub{font-size:clamp(1rem,4.4vw,1.4rem);letter-spacing:.3em;text-transform:uppercase;color:#fff;font-weight:700}

  @media (prefers-reduced-motion:reduce){
    .pulse,.boom,.stage.alarm{animation-duration:.01ms;animation-iteration-count:1}
    .stage.alarm{background:var(--danger)}
  }

  /* alarm picker */
  .picker{display:flex;flex-direction:column;gap:.55rem;align-items:center}
  .picker-label{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .opts{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;max-width:340px}
  .opt{
    font-family:"Oswald",sans-serif;font-size:.82rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    padding:.5rem .9rem;border-radius:999px;border:2px solid #2a2a2d;background:var(--panel);color:var(--fg);
    cursor:pointer;transition:transform .1s,border-color .15s,color .15s;
  }
  .opt[aria-pressed="true"]{border-color:var(--hazard);color:var(--hazard);box-shadow:inset 0 0 0 1px var(--hazard)}
  .opt:active{transform:scale(.95)}
  .picker-note{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

  /* fullscreen toggle */
  .fs-btn{
    position:absolute;top:0;right:0;z-index:6;
    margin-top:calc(20px + env(safe-area-inset-top,0px));
    margin-right:calc(12px + env(safe-area-inset-right,0px));
    width:42px;height:42px;display:grid;place-items:center;
    background:var(--panel);color:var(--fg);border:2px solid #2a2a2d;border-radius:11px;
    cursor:pointer;opacity:.82;transition:opacity .15s,transform .1s,border-color .15s;
  }
  .fs-btn:hover{opacity:1}
  .fs-btn:active{transform:scale(.93)}
  .fs-btn svg{width:22px;height:22px;display:block}
  .fs-btn .ic-exit{display:none}
  .fs-btn.on{border-color:var(--hazard);color:var(--hazard)}
  .fs-btn.on .ic-enter{display:none}
  .fs-btn.on .ic-exit{display:block}

  [hidden]{display:none!important}
  :focus-visible{outline:3px solid var(--hazard);outline-offset:4px}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="tape"></div>
  <div class="tape bottom"></div>

  <button id="fsBtn" class="fs-btn" type="button" aria-label="Toggle fullscreen" title="Fullscreen" hidden>
    <svg class="ic-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    <svg class="ic-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
  </button>

  <!-- IDLE -->
  <section id="view-idle" class="brand">
    <h1 class="title"><span class="d1">DANGER</span> <span class="d2">DANGER</span></h1>
    <p class="subtitle">Blind Timer · 60 Seconds</p>
  </section>
  <button id="startBtn" class="dial start">Start</button>
  <p class="hint" id="idleHint">Tap to arm · no countdown shown</p>

  <div class="picker" id="picker">
    <span class="picker-label">Alarm Sound</span>
    <div class="opts" id="opts"></div>
    <span class="picker-note">Tap a sound to preview</span>
  </div>

  <!-- ARMED -->
  <section id="view-armed" class="armed" hidden>
    <div class="pulse"><span>☠️</span></div>
    <div class="armed-label">Running</div>
    <div class="armed-sub">Alarm hidden until it fires</div>
    <div class="armed-note" id="awakeNote"></div>
  </section>
  <button id="stopBtn" class="dial stop" hidden>Stop</button>

  <!-- ALARM -->
  <section id="view-alarm" hidden style="display:flex;flex-direction:column;gap:1rem;align-items:center">
    <h2 class="boom">Time!</h2>
    <p class="boom-sub">60 seconds up</p>
  </section>
  <button id="resetBtn" class="dial stop" hidden>Reset</button>
</div>

<script>
(function(){
  "use strict";
  var DURATION = 60000; // ms — exactly 60 seconds
  var state = "idle";
  var timerId = null, alarmLoop = null, vibrateLoop = null, wakeLock = null, audioCtx = null, pulseTimer = null;

  var stage   = document.getElementById("stage");
  var vIdle   = document.getElementById("view-idle");
  var vArmed  = document.getElementById("view-armed");
  var vAlarm  = document.getElementById("view-alarm");
  var startBtn= document.getElementById("startBtn");
  var stopBtn = document.getElementById("stopBtn");
  var resetBtn= document.getElementById("resetBtn");
  var idleHint= document.getElementById("idleHint");

  function show(el,on){ el.hidden = !on; }

  function render(){
    show(vIdle, state==="idle");   show(startBtn, state==="idle");  show(idleHint, state==="idle");
    if(picker) show(picker, state==="idle");
    show(vArmed, state==="armed"); show(stopBtn, state==="armed");
    show(vAlarm, state==="alarm"); show(resetBtn, state==="alarm");
    stage.classList.toggle("alarm", state==="alarm");
  }

  /* ---- Keep the screen awake while the timer runs (so JS timers don't freeze) ----
     Primary: Screen Wake Lock. Fallback: a tiny muted looping video, which keeps
     Android awake even where Wake Lock is blocked (e.g. a local file:// page). ---- */
  var awakeNote = document.getElementById("awakeNote");
  var wakeLockOK = false, keepVideo = null, keepStream = null, keepRAF = null;

  function setAwakeNote(){
    if(!awakeNote) return;
    var holding = wakeLockOK || (keepVideo && !keepVideo.paused);
    awakeNote.textContent = holding ? "Screen kept on" : "Keep your screen awake";
  }

  function acquireWakeLock(){
    try{
      if("wakeLock" in navigator){
        navigator.wakeLock.request("screen").then(function(w){
          wakeLock = w; wakeLockOK = true;
          w.addEventListener("release", function(){ wakeLockOK = false; setAwakeNote(); });
          setAwakeNote();
        }).catch(function(){ wakeLockOK = false; setAwakeNote(); });
      }
    }catch(e){ wakeLockOK = false; }
  }

  function startVideoFallback(){
    try{
      if(keepVideo || !HTMLCanvasElement.prototype.captureStream) return;
      var canvas = document.createElement("canvas");
      canvas.width = 2; canvas.height = 2;
      var ctx = canvas.getContext("2d");
      keepStream = canvas.captureStream(1);
      keepVideo = document.createElement("video");
      keepVideo.muted = true; keepVideo.defaultMuted = true; keepVideo.loop = true;
      keepVideo.setAttribute("muted",""); keepVideo.setAttribute("playsinline","");
      keepVideo.playsInline = true; keepVideo.setAttribute("aria-hidden","true");
      keepVideo.style.cssText = "position:fixed;left:-9px;top:-9px;width:1px;height:1px;opacity:.01;pointer-events:none";
      keepVideo.srcObject = keepStream;
      document.body.appendChild(keepVideo);
      (function draw(){
        if(!keepVideo) return;
        ctx.fillStyle = (Date.now() >> 9) & 1 ? "#000" : "#010101";
        ctx.fillRect(0, 0, 2, 2);
        keepRAF = requestAnimationFrame(draw);
      })();
      var p = keepVideo.play();
      if(p && p.then){ p.then(setAwakeNote).catch(setAwakeNote); }
    }catch(e){}
  }
  function stopVideoFallback(){
    try{
      if(keepRAF){ cancelAnimationFrame(keepRAF); keepRAF = null; }
      if(keepVideo){ keepVideo.pause(); keepVideo.srcObject = null; keepVideo.remove(); keepVideo = null; }
      if(keepStream){ keepStream.getTracks().forEach(function(t){ t.stop(); }); keepStream = null; }
    }catch(e){}
  }

  function keepAwake(){
    acquireWakeLock();
    startVideoFallback();
    setTimeout(setAwakeNote, 400);
  }
  function releaseAwake(){
    try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
    wakeLockOK = false;
    stopVideoFallback();
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState==="visible" && (state==="armed" || state==="alarm")){
      acquireWakeLock();
      if(keepVideo){ var p = keepVideo.play(); if(p && p.catch) p.catch(function(){}); }
    }
  });

  /* ---- Continuous pulse, random duration each cycle: always alive, no countable beat ---- */
  var pulseEl = document.querySelector(".pulse");
  function nextPing(){
    if(state!=="armed" || !pulseEl) return;
    pulseEl.style.setProperty("--psize", (34 + Math.random()*16).toFixed(0) + "px");
    pulseEl.style.setProperty("--pdur",  (0.8 + Math.random()*1.5).toFixed(2) + "s"); // 0.8–2.3s
    pulseEl.classList.remove("ping");
    void pulseEl.offsetWidth;            // reflow so the animation restarts
    pulseEl.classList.add("ping");
  }
  function onPulseEnd(){ if(state==="armed") nextPing(); } // chain the next ring immediately — no gap
  function startPulsing(){
    if(!pulseEl) return;
    pulseEl.addEventListener("animationend", onPulseEnd);
    nextPing();
  }
  function stopPulsing(){
    if(pulseEl){ pulseEl.removeEventListener("animationend", onPulseEnd); pulseEl.classList.remove("ping"); }
  }

  /* ---- Audio buzzer via Web Audio (starts on the Start tap) ---- */
  function ensureAudio(){
    try{
      if(!audioCtx){ var AC = window.AudioContext||window.webkitAudioContext; audioCtx = new AC(); }
      if(audioCtx.state==="suspended") audioCtx.resume();
    }catch(e){ audioCtx=null; }
  }

  /* ---- Alarm sounds: each is one repeating cycle, synthesized live ---- */
  var ALARMS = {
    horn:  {label:"Hazard Horn", cycle:0.70},
    siren: {label:"Air Raid",    cycle:1.30},
    klaxon:{label:"Klaxon",      cycle:0.72},
    beeps: {label:"Beep Burst",  cycle:0.95}
  };
  var ORDER = ["horn","siren","klaxon","beeps"];
  var currentAlarm = "horn";

  function voice(type){
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.connect(g); g.connect(audioCtx.destination);
    return {o:o,g:g};
  }
  function playCycle(name){
    if(!audioCtx) return;
    try{
      var t = audioCtx.currentTime, v, o, g, i, tt;
      if(name==="horn"){                 // two-tone "nee-naw"
        v=voice("square"); o=v.o; g=v.g;
        o.frequency.setValueAtTime(880,t); o.frequency.setValueAtTime(620,t+0.2); o.frequency.setValueAtTime(880,t+0.4);
        g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.02);
        g.gain.setValueAtTime(0.5,t+0.55); g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
        o.start(t); o.stop(t+0.61);
      } else if(name==="siren"){         // rising/falling sweep
        v=voice("sawtooth"); o=v.o; g=v.g;
        o.frequency.setValueAtTime(430,t); o.frequency.linearRampToValueAtTime(1040,t+0.6); o.frequency.linearRampToValueAtTime(430,t+1.2);
        g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.05);
        g.gain.setValueAtTime(0.4,t+1.15); g.gain.exponentialRampToValueAtTime(0.0001,t+1.25);
        o.start(t); o.stop(t+1.26);
      } else if(name==="klaxon"){        // harsh low honk
        v=voice("square"); o=v.o; g=v.g;
        o.frequency.setValueAtTime(196,t);
        g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.55,t+0.01);
        g.gain.setValueAtTime(0.55,t+0.42); g.gain.exponentialRampToValueAtTime(0.0001,t+0.48);
        o.start(t); o.stop(t+0.49);
      } else if(name==="beeps"){         // three sharp high beeps
        for(i=0;i<3;i++){
          tt=t+i*0.17; v=voice("square"); o=v.o; g=v.g;
          o.frequency.setValueAtTime(1180,tt);
          g.gain.setValueAtTime(0.0001,tt); g.gain.exponentialRampToValueAtTime(0.45,tt+0.01);
          g.gain.setValueAtTime(0.45,tt+0.08); g.gain.exponentialRampToValueAtTime(0.0001,tt+0.1);
          o.start(tt); o.stop(tt+0.11);
        }
      }
    }catch(e){}
  }

  function fireAlarm(){
    stopPulsing();
    state = "alarm"; render();
    playCycle(currentAlarm);
    alarmLoop = setInterval(function(){ playCycle(currentAlarm); }, ALARMS[currentAlarm].cycle*1000);
    try{ if(navigator.vibrate){ navigator.vibrate([400,120,400,120,600]); vibrateLoop = setInterval(function(){ navigator.vibrate([400,120,400,120,600]); }, 1800); } }catch(e){}
    /* keep the screen awake through the alarm too — released on reset */
  }

  function start(){
    ensureAudio();
    keepAwake();
    state = "armed"; render();
    startPulsing();
    timerId = setTimeout(fireAlarm, DURATION);
  }

  function reset(){
    stopPulsing();
    if(timerId){ clearTimeout(timerId); timerId=null; }
    if(alarmLoop){ clearInterval(alarmLoop); alarmLoop=null; }
    if(vibrateLoop){ clearInterval(vibrateLoop); vibrateLoop=null; }
    try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
    releaseAwake();
    state = "idle"; render();
  }

  startBtn.addEventListener("click", start);
  stopBtn.addEventListener("click", reset);
  resetBtn.addEventListener("click", reset);

  /* ---- Alarm picker: remember choice, tap to preview one cycle ---- */
  var picker = document.getElementById("picker");
  var opts   = document.getElementById("opts");
  try{ var saved = localStorage.getItem("dd_alarm"); if(saved && ALARMS[saved]) currentAlarm = saved; }catch(e){}
  ORDER.forEach(function(name){
    var b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.textContent = ALARMS[name].label;
    b.setAttribute("aria-pressed", name===currentAlarm ? "true" : "false");
    b.addEventListener("click", function(){
      currentAlarm = name;
      try{ localStorage.setItem("dd_alarm", name); }catch(e){}
      Array.prototype.forEach.call(opts.children, function(c){ c.setAttribute("aria-pressed", c===b ? "true" : "false"); });
      ensureAudio(); playCycle(name); // short preview
    });
    opts.appendChild(b);
  });

  /* ---- Fullscreen toggle (for in-browser viewing) ---- */
  var fsBtn = document.getElementById("fsBtn");
  function isFs(){ return document.fullscreenElement || document.webkitFullscreenElement; }
  function enterFs(){
    var el = document.documentElement, r = el.requestFullscreen || el.webkitRequestFullscreen;
    if(r){ try{ var p = r.call(el); if(p && p.catch) p.catch(function(){}); }catch(e){} }
  }
  function exitFs(){
    var x = document.exitFullscreen || document.webkitExitFullscreen;
    if(x){ try{ x.call(document); }catch(e){} }
  }
  if(fsBtn && (document.fullscreenEnabled || document.webkitFullscreenEnabled)){
    fsBtn.hidden = false;
    fsBtn.addEventListener("click", function(){ if(isFs()) exitFs(); else enterFs(); });
    var syncFs = function(){ fsBtn.classList.toggle("on", !!isFs()); };
    document.addEventListener("fullscreenchange", syncFs);
    document.addEventListener("webkitfullscreenchange", syncFs);
  }

  render();

  /* ---- Register service worker for offline / installability ---- */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
